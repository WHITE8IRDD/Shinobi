<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shinobi — master brand mark.
  The single source of truth for every Shinobi icon and logo placement. Edit this file, then
  run `node generate-icons.mjs` from the branding/ directory to regenerate the launcher icon,
  notification icon, splash emblem and in-app mark under app/src/main/res/.

  The mark is a ninja's masked face read as a bold "S": the head and shoulder sash of the
  silhouette, with two angled eye slits cut out as holes so whatever surface the mark sits on
  shows through them. The silhouette is monochrome on purpose - it is tinted at the point of
  use, so it reads correctly on the near-black launcher tile, on the warm light theme, in
  Material You wallpaper colours and in right-to-left layouts alike.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" fill="none">
  <g id="shinobi-mark">
    <path id="body" fill="#FFFFFF" d="M 150.00,206.00 Q 150.00,176.00 179.90,173.61 L 920.10,114.39 Q 950.00,112.00 950.00,142.00 L 950.00,342.00 Q 950.00,372.00 920.00,372.00 L 560.00,372.00 Q 530.00,372.00 530.00,402.00 L 530.00,462.00 Q 530.00,492.00 560.00,492.00 L 920.00,492.00 Q 950.00,492.00 950.00,522.00 L 950.00,670.00 Q 950.00,700.00 926.87,719.11 L 743.13,870.89 Q 720.00,890.00 690.06,891.88 L 399.94,910.12 Q 370.00,912.00 345.32,894.95 L 174.68,777.05 Q 150.00,760.00 179.42,754.12 L 470.58,695.88 Q 500.00,690.00 500.00,660.00 L 500.00,600.00 Q 500.00,570.00 470.00,570.00 L 180.00,570.00 Q 150.00,570.00 150.00,540.00 Z"/>
    <path id="eye-left" fill="#000000" d="M 286.00,202.00 Q 286.00,190.00 296.13,196.43 L 505.87,329.57 Q 516.00,336.00 516.00,348.00 L 516.00,384.00 Q 516.00,396.00 505.91,389.51 L 296.09,254.49 Q 286.00,248.00 286.00,236.00 Z"/>
