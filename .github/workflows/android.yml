name: Android

on:
  push:
    branches: [main, "arena/**"]
    # Drafts are tagged (draft-1, draft-2, …); an official release is tagged v1.0.0.
    tags: ["draft-*", "v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. draft-1 (leave empty to build only)"
        required: false
        default: ""
      name:
        description: "Release name, e.g. Draft 1"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Zero-ads and branding guard
        run: |
          # The pattern literals are split so this script cannot match itself.
          OLD_BRAND="ski""pii"
          if grep -rniI "$OLD_BRAND" --exclude-dir=.git . ; then
            echo "::error::A removed brand name reappeared in the repository."
            exit 1
          fi
          AD_SDKS="admob|applovin|ironsource|mopub|chartboost|vungle|startapp|inmobi|play-services-ads|facebook-android-sdk|unity3d.ads|com.google.ads|ads-identifier|crashlytics|firebase-analytics|mixpanel|amplitude|com.segment.analytics"
          if grep -rniE "$AD_SDKS" build.gradle.kts settings.gradle.kts gradle.properties app/build.gradle.kts app/src/main/AndroidManifest.xml ; then
            echo "::error::An advertising or tracking SDK reference appeared in the build configuration."
            exit 1
          fi
          echo "No advertising, tracking or removed-brand references found."

      - name: Zero-ads dependency guard
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > deps.txt
          AD_SDKS="admob|applovin|ironsource|mopub|chartboost|vungle|startapp|inmobi|play-services-ads|facebook-android-sdk|unity3d.ads|ads-identifier|crashlytics|firebase|mixpanel|amplitude|com.segment.analytics"
          if grep -iE "$AD_SDKS" deps.txt ; then
            echo "::error::An advertising or tracking SDK is on the release runtime classpath."
            exit 1
          fi
          echo "Release runtime classpath is free of advertising and tracking SDKs."

      - name: Branding assets are up to date
        run: |
          # Every icon and logo in the app is generated from branding/source/shinobi-mark.svg.
          # Regenerate and fail if the checked-in assets differ, so a hand-edited drawable or a
          # master artwork change that was not propagated cannot ship.
          if ! command -v node >/dev/null 2>&1; then
            echo "::error::node is required to verify the generated branding assets."
            exit 1
          fi
          node branding/generate-icons.mjs
          if ! git diff --exit-code --stat -- app/src/main/res branding/preview branding/store ; then
            echo "::error::Generated branding assets are stale. Run 'node branding/generate-icons.mjs' and commit the result."
            exit 1
          fi
          echo "Generated branding assets match branding/source/shinobi-mark.svg."

      - name: Public YouTube route diagnostics (no account cookies)
        run: python3 .github/scripts/probe_discovery.py

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a build.log

      - name: Summarize unit tests
        if: always()
        run: python3 .github/scripts/summarize_tests.py app/build/test-results

      - name: Assemble APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --console=plain 2>&1 | tee -a build.log

      - name: Publish failure log as annotations
        if: failure()
        run: python3 .github/scripts/annotate_failure.py build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Name the 2.0 candidate APK
        if: success()
        run: |
          mkdir -p package
          cp app/build/outputs/apk/release/app-release.apk 'package/SHINOBI 2.0.apk'

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-apks
          path: |
            app/build/outputs/apk/**/*.apk
            package/*.apk
          if-no-files-found: error
          retention-days: 14

  layout-tests:
    runs-on: ubuntu-latest
    permissions:
      # Only for the opt-in screenshot commit below; everything else is read-only.
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Narrow-screen English and Arabic layout regressions, app screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          # The screenshot tests write to Download/shinobi-screenshots on the emulator; pull
          # them before the emulator is torn down, whether or not the tests passed.
          script: |
            bash -o pipefail -c './gradlew connectedDebugAndroidTest --console=plain 2>&1 | tee layout.log' || touch device-tests-failed
            adb pull /sdcard/Download/shinobi-screenshots screenshots || echo no screenshots were produced
            adb logcat -d -s ShinobiShots:I > screenshots.log || true
            test ! -f device-tests-failed
      - name: Annotate device test failures
        if: failure()
        run: python3 .github/scripts/annotate_failure.py layout.log 160
      - name: Summarize device tests
        if: always()
        run: python3 .github/scripts/summarize_tests.py app/build/outputs/androidTest-results
      - name: List screenshots
        if: always()
        run: |
          if [ -d screenshots ]; then
            ls -l screenshots
            for f in screenshots/*.txt; do [ -f "$f" ] && { echo "--- $f"; cat "$f"; echo; }; done
          else
            echo "No screenshots directory."
          fi
      - name: Report measured frame timings
        if: always()
        run: |
          python3 - <<'PYTHON'
          import pathlib
          for path in pathlib.Path('screenshots').rglob('performance-scroll*.txt'):
              print('::notice::' + path.read_text().replace('%', '%25').replace('\n', '%0A'))
          PYTHON
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            screenshots
            screenshots.log
          if-no-files-found: ignore
      # Opt in per commit with "[screenshots]" in the message: the pictures are committed to
      # docs/screenshots on the same branch so they can be reviewed (and linked from release
      # notes) without downloading artifacts. The bot commit is marked [skip ci].
      - name: Commit the screenshots to the branch
        if: >-
          always() && github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[screenshots]')
        run: |
          if [ ! -d screenshots ]; then echo "No screenshots to commit."; exit 0; fi
          rm -rf docs/screenshots && mkdir -p docs/screenshots
          cp screenshots/* docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then echo "Screenshots unchanged."; exit 0; fi
          git commit -m "docs: device screenshots from run ${{ github.run_id }} [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME" || true
          git push origin "HEAD:$GITHUB_REF_NAME"
      - name: Upload device test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results

  # Publishing is explicit and always follows a passing build: pushing a draft-*/v* tag, or
  # running this workflow manually with a tag and a name, attaches the APKs built by the job
  # above to a GitHub release. Explicit, branch-scoped publication commits also support
  # connections without Actions dispatch/artifact-download access.
  # Ordinary pushes (including later work on that branch) must NEVER publish a release.
  release:
    if: >-
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'workflow_dispatch' && inputs.tag != '') ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/arena/e9eca407-shinobi' &&
       startsWith(github.event.head_commit.message, 'release: publish SHINOBI 1.3')) ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/arena/7d8da2e3-shinobi' &&
       startsWith(github.event.head_commit.message, 'release: publish SHINOBI 1.9 IMPROVED'))
    needs: [build, layout-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The GitHub CLI and the shared failure annotator both need the checked-out source.
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Download the APKs this run just built
        uses: actions/download-artifact@v4
        with:
          name: shinobi-apks
          path: apks

      - name: Publish the release with its APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || (github.ref == 'refs/heads/arena/7d8da2e3-shinobi' && 'v1.9-improved') || 'v1.3' }}
          NAME: ${{ github.ref_type == 'tag' && '' || inputs.name }}
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          {
            set -euo pipefail
            # "draft-1" becomes "Draft 1"; a version tag names the product and its version,
            # so v1.0 publishes as "SHINOBI 1.0" with Shinobi-1.0-*.apk beside it.
            # The notes file's H1, when present, is the release name — one place to keep
            # docs/releases/<tag>.md and the published title in agreement.
            if [[ -z "$NAME" && -f "docs/releases/$TAG.md" ]]; then
              NAME=$(head -n 1 "docs/releases/$TAG.md" | sed -E 's/^#+[[:space:]]*//;s/[[:space:]]+$//')
            fi
            if [[ -z "$NAME" ]]; then
              if [[ "$TAG" =~ ^[vV][0-9] ]]; then
                NAME="SHINOBI ${TAG#[vV]}"
              else
                NAME=$(echo "$TAG" | tr '-' ' ' | awk '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)}}1')
              fi
            fi
            SLUG="${NAME// /-}"
            # "SHINOBI 1.0" names the release, not the product twice: the APKs become
            # Shinobi-1.0-release.apk rather than Shinobi-SHINOBI-1.0-release.apk.
            FILE_SLUG="$SLUG"
            case "${FILE_SLUG^^}" in
              SHINOBI-*) FILE_SLUG="${FILE_SLUG#*[Ss][Hh][Ii][Nn][Oo][Bb][Ii]-}" ;;
            esac
            # Asset paths must stay plain ASCII words: gh parses each asset argument as a
            # URL, so a '#' would be eaten as a fragment and the upload would fail.
            FILE_SLUG="${FILE_SLUG//[!A-Za-z0-9.-]/-}"
            echo "Release tag '$TAG', title '$NAME'"

            echo "--- downloaded artifact contents ---"
            find apks -type f -printf '%p  %s bytes\n' | sort
            RELEASE_APK=$(find apks -type f -name 'app-release.apk' -print -quit)
            DEBUG_APK=$(find apks -type f -name 'app-debug.apk' -print -quit)
            if [[ ! -s "$RELEASE_APK" || ! -s "$DEBUG_APK" ]]; then
              echo "::error::the shinobi-apks artifact did not contain both APKs"
              exit 1
            fi

            mkdir -p publish
            RELEASE_FILENAME="Shinobi-${FILE_SLUG}-release.apk"
            DEBUG_FILENAME="Shinobi-${FILE_SLUG}-debug.apk"
            if [[ "$NAME" == "SHINOBI 1.9 IMPROVED" ]]; then
              RELEASE_FILENAME="SHINOBI 1.9 IMPROVED.apk"
              DEBUG_FILENAME="SHINOBI 1.9 IMPROVED-debug.apk"
            fi
            cp "$RELEASE_APK" "publish/$RELEASE_FILENAME"
            cp "$DEBUG_APK" "publish/$DEBUG_FILENAME"
            (cd publish && sha256sum *.apk) > publish/SHA256SUMS.txt
            assets=(publish/*.apk publish/SHA256SUMS.txt)
            ls -l publish

            {
              printf 'Built from the source at this tag by GitHub Actions, with unit tests, emulator\n'
              printf 'regressions and both zero-ads guards passing in the same run.\n\n'
              printf '**Source:** `%s` · **Verification:** %s\n\n' "$SHA" "$RUN_URL"
              printf '**Install (sideload):** download `%s`, open it on your phone.\n' "$RELEASE_FILENAME"
              printf 'Allow installing from this source when Android asks. Android 8.0 (API 26) or newer is required.\n'
              printf 'The release APK is signed with the Android Gradle debug signing configuration in `app/build.gradle.kts`.\n'
              printf 'For a first install, sideload normally; to update a copy signed with a different key, uninstall it first.\n\n'
              printf 'The release APK is minified for daily use. The debug APK contains the same source without minification and is useful when investigating a bug.\n'
            } > notes.md

            # Keep version-specific changes and validation/signing limitations with the APKs.
            if [[ -f "docs/releases/$TAG.md" ]]; then
              printf '\n---\n\n' >> notes.md
              cat "docs/releases/$TAG.md" >> notes.md
            fi

            release_args=(--title "$NAME" --notes-file notes.md)
            # A pushed tag already names its commit; only a manual run needs --target.
            if [[ "$REF_TYPE" != "tag" ]]; then
              release_args+=(--target "$SHA")
            fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists; updating its title, notes, and APKs."
              gh release edit "$TAG" --title "$NAME" --notes-file notes.md
              gh release upload "$TAG" "${assets[@]}" --clobber
            else
              gh release create "$TAG" "${release_args[@]}" "${assets[@]}"
            fi

            echo "--- published release ---"
            gh release view "$TAG"
          } 2>&1 | tee release.log

      - name: Publish failure log as annotations
        if: failure()
        run: python3 .github/scripts/annotate_failure.py release.log 200
