name: Android

on:
  push:
    branches: [main, "arena/**"]
    # Drafts are tagged (draft-1, draft-2, …); an official release is tagged v1.0.0.
    tags: ["draft-*", "v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. draft-1 (leave empty to build only)"
        required: false
        default: ""
      name:
        description: "Release name, e.g. Draft 1"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Zero-ads and branding guard
        run: |
          # The pattern literals are split so this script cannot match itself.
          OLD_BRAND="ski""pii"
          if grep -rniI "$OLD_BRAND" --exclude-dir=.git . ; then
            echo "::error::A removed brand name reappeared in the repository."
            exit 1
          fi
          AD_SDKS="admob|applovin|ironsource|mopub|chartboost|vungle|startapp|inmobi|play-services-ads|facebook-android-sdk|unity3d.ads|com.google.ads|ads-identifier|crashlytics|firebase-analytics|mixpanel|amplitude|com.segment.analytics"
          if grep -rniE "$AD_SDKS" build.gradle.kts settings.gradle.kts gradle.properties app/build.gradle.kts app/src/main/AndroidManifest.xml ; then
            echo "::error::An advertising or tracking SDK reference appeared in the build configuration."
            exit 1
          fi
          echo "No advertising, tracking or removed-brand references found."

      - name: Zero-ads dependency guard
        run: |
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --console=plain > deps.txt
          AD_SDKS="admob|applovin|ironsource|mopub|chartboost|vungle|startapp|inmobi|play-services-ads|facebook-android-sdk|unity3d.ads|ads-identifier|crashlytics|firebase|mixpanel|amplitude|com.segment.analytics"
          if grep -iE "$AD_SDKS" deps.txt ; then
            echo "::error::An advertising or tracking SDK is on the release runtime classpath."
            exit 1
          fi
          echo "Release runtime classpath is free of advertising and tracking SDKs."

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --console=plain 2>&1 | tee -a build.log

      - name: Assemble APKs
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --console=plain 2>&1 | tee -a build.log

      - name: Publish failure log as annotations
        if: failure()
        run: python3 .github/scripts/annotate_failure.py build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shinobi-apks
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  # Publishing is explicit and always follows a passing build: pushing a draft-*/v* tag, or
  # running this workflow manually with a tag and a name, attaches the APKs built by the job
  # above to a GitHub release. Nothing else publishes.
  release:
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the APKs this run just built
        uses: actions/download-artifact@v4
        with:
          name: shinobi-apks
          path: apks

      - name: Publish the release with its APKs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          NAME: ${{ github.ref_type == 'tag' && '' || inputs.name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -o pipefail
          {
            set -e
            # "draft-1" becomes "Draft 1" when no nicer name was given.
            if [ -z "$NAME" ]; then
              NAME=$(echo "$TAG" | tr '-' ' ' | awk '{for(i=1;i<=NF;i++){$i=toupper(substr($i,1,1)) substr($i,2)}}1')
            fi
            SLUG="${NAME// /-}"
            echo "Release tag '$TAG', title '$NAME'"

            echo "--- artifact contents ---"
            find apks -type f -printf '%p  %s bytes\n' | sort

            RELEASE_APK=$(find apks -name 'app-release.apk' | head -n 1)
            DEBUG_APK=$(find apks -name 'app-debug.apk' | head -n 1)
            if [ -z "$RELEASE_APK" ] || [ -z "$DEBUG_APK" ]; then
              echo "::error::the shinobi-apks artifact did not contain both APKs"
              exit 1
            fi
            mkdir -p publish
            cp "$RELEASE_APK" "publish/Shinobi-${SLUG}-release.apk"
            cp "$DEBUG_APK" "publish/Shinobi-${SLUG}-debug.apk"
            ls -l publish

            # Distinguish "the token may not write" from a mistake in this script, and say so
            # in the log rather than leaving a bare exit code behind.
            probe=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/git/refs/heads/definitely-does-not-exist")
            case "$probe" in
              403) echo "::error::GITHUB_TOKEN cannot write to this repository (probe returned 403): set Settings -> Actions -> General -> Workflow permissions to 'Read and write permissions'." ; exit 1 ;;
              *) echo "Token write probe returned $probe, so the token may write." ;;
            esac

            if [ "$REF_TYPE" != "tag" ]; then TARGET="--target $SHA"; else TARGET=""; fi
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG already exists: uploading the APKs to it instead."
              gh release upload "$TAG" publish/*.apk --clobber
            else
              {
                printf 'Built from the source at this tag by GitHub Actions, with unit tests and both\n'
                printf 'zero-ads guards passing in the same run.\n\n'
                printf '**Install (sideload):** download `Shinobi-%s-release.apk`, open it on the phone\n' "$SLUG"
                printf 'and allow installing from this source when Android asks. Android 8.0 (API 26) or\n'
                printf 'newer is required. The release build is signed with a locally generated key, so it\n'
                printf 'installs over any earlier Shinobi build, and it needs no account: search, playback,\n'
                printf 'captions and signed-out history work straight away.\n\n'
                printf '`Shinobi-%s-release.apk` is the minified build made for daily use;\n' "$SLUG"
                printf '`Shinobi-%s-debug.apk` is the same code without minification, useful if a bug\n' "$SLUG"
                printf 'needs logs.\n'
              } > notes.md
              gh release create "$TAG" --title "$NAME" --notes-file notes.md $TARGET publish/*.apk
            fi

            echo "--- published ---"
            gh release view "$TAG"
          } 2>&1 | tee release.log

      - name: Publish failure log as annotations
        if: failure()
        run: python3 .github/scripts/annotate_failure.py release.log 200
