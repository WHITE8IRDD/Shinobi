name: Probe

on:
  workflow_dispatch:
    inputs:
      country:
        description: "Country code to probe the trending routes for"
        required: false
        default: "MA"

permissions:
  contents: write

jobs:
  probe:
    if: github.ref == 'refs/heads/arena/17aa39de-shinobi'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Which public route still carries a country's real trending list. The report is
      # committed to the branch, so the whole answer is readable without a log download.
      - name: Probe the regional trending routes
        run: |
          python3 .github/scripts/probe_trending.py "${{ github.event.inputs.country || 'MA' }}" "docs/probes/trending-${{ github.event.inputs.country || 'MA' }}.md"

      - name: Commit the probe report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/probes
          if git diff --cached --quiet; then
            echo "The probe report is unchanged."
            exit 0
          fi
          git commit -m "docs: regional trending probe [skip ci]"
          git pull --rebase origin arena/17aa39de-shinobi
          git push origin arena/17aa39de-shinobi
